 <section class="pane" aria-label="Conversation" data-t="${t?t.id:''}">${t?`${!Net.on?`<div class="cbar" role="status">You’re offline. Messages will send automatically when you reconnect.</div>`:""}<div class="ph"><button class="back" aria-label="Back to conversations" onclick="S.thread=null;Chat.stick=true;render()">‹</button><span class="avw"><div class="av" style="${abg(t.n)}">${ait(t.n)}</div>${pres(t.on)}</span><div class="phn"><b>${esc(t.n)}</b><small class="${t.typing||t.on?"on":""}">${t.typing?"typing…":t.on?"Online":SB_ON?"Offline":""}</small></div><button class="btn alt rep" data-n="${esc(t.n)}" onclick="reportUser(this.dataset.n)" aria-label="Report ${esc(t.n)}">Report</button></div>
 <div class="msgs" id="ms" aria-live="polite">${t.m.map(m=>`<div class="m ${m.me?"me":""}">${qCard(m,t)}${fmtMsg(m.t)}${actBar(m)}<span class="mt">${new Date(m.ts).toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"})}${m.me?" "+({sending:"⏳ Sending",sent:"✓ Sent",delivered:"✓✓ Delivered",read:"✓✓ Read",failed:""})[m.st]:""}${m.st==="failed"?`<span style="color:#c0261c;font-weight:700">Not sent</span><button class="rt" onclick="Chat.retry('${m.id}')">Retry</button>`:""}</span></div>`).join("")}</div>
 <form class="send" style="max-width:none" onsubmit="sendMsg(event)"><input id="mi" autocomplete="off" autocapitalize="sentences" enterkeyhint="send" maxlength="1000" aria-label="Message" placeholder="Write a message"><button class="btn" onpointerdown="event.preventDefault()">Send</button></form>`:`<div class="empty" style="margin:auto">Pick a conversation to start chatting.</div>`}</section></div>`;
 const m=V.querySelector("#ms");if(m){if(Chat.stick!==false||Chat.pos==null)m.scrollTop=m.scrollHeight;else m.scrollTop=Math.min(Chat.pos,m.scrollHeight)}}
function sendMsg(e){e.preventDefault();const i=document.getElementById("mi");if(!i)return;Chat.stick=true;if(Chat.send(S.thread,i.value)){i.value=""}ui();const n=document.getElementById("mi");if(n)n.focus({preventScroll:true})}
const rank={sending:0,sent:1,delivered:2,read:3};
const Net={on:navigator.onLine!==false,send(e){return Net.on?RT.send(e):Promise.reject("offline")},
 set(on){if(Net.on===on)return;Net.on=on;if(on){S.threads.forEach(t=>t.m.forEach(m=>{if(m.st==="sending")m.next=0}));Chat.flush();if(typeof RT!=="undefined")RT.poll()}ui()}};
const Chat={busy:0,ackMs:4000,max:5,base:800,rt:null,
 send(tid,text){const t=S.threads.find(x=>x.id===tid);text=(text||"").trim();if(!t||!text)return null;if(text.length>1000){toast("Message is too long (max 1000 characters)");return null}
  const m={id:"m"+uid(),me:1,t:text,ts:Date.now(),st:"sending",tries:0};t.m.push(m);S.chatStats.sent++;save();Chat.flush();return m},
 async flush(){if(Chat.busy||!Net.on)return;Chat.busy=1;

/* ---------- Real-time direct messaging. Only real people reply: no bots. Transport: Supabase table rc_msgs (Realtime push + 5 s polling) or, when Supabase isn't configured, a shared mailbox in this browser (other tabs get messages instantly). ---------- */
const RT={ok:null,err:undefined,at:0,me:"",since:0,first:true,timer:null,ch:null,pch:null,bc:null,

 async send(e){const row={id:e.id,from_name:S.name,to_name:e.peer,body:e.t,ts:e.ts,status:"sent"};

  if(SB_ON){let u="?order=ts.asc&limit=500&select=id,from_name,to_name,body,ts,status";if(q.to)u+="&to_name=eq."+enc(q.to);if(q.from)u+="&from_name=eq."+enc(q.from);if(q.since!=null)u+="&ts=gt."+q.since;const j=await(await RT.req(u)).json();return Array.isArray(j)?j:[]}
  return RT.lm().filter(x=>(!q.to||x.to_name===q.to)&&(!q.from||x.from_name===q.from)&&(q.since==null||+x.ts>q.since)).sort((a,b)=>a.ts-b.ts)},
 async patch(f,st){const enc=encodeURIComponent;
  if(SB_ON){let u="?"+(f.id?"id=eq."+enc(f.id):"to_name=eq."+enc(f.to)+"&from_name=eq."+enc(f.from))+(st==="delivered"?"&status=eq.sent":"&status=neq.read");await RT.req(u,{method:"PATCH",headers:cHead({Prefer:"return=minimal"}),body:JSON.stringify({status:st})});return}
  const a=RT.lm();let ch=false;a.forEach(x=>{if((f.id?x.id===f.id:x.to_name===f.to&&x.from_name===f.from)&&(rank[x.status]||0)<rank[st]){x.status=st;ch=true}});if(ch){RT.lmSave(a);RT.ping("s")}},
 incoming(r,quiet){if(!r||r.to_name!==S.name)return;Chat.receive({id:r.id,peer:r.from_name,t:r.body,ts:+r.ts,quiet:!!quiet,read:r.status==="read"});
  const t=S.threads.find(x=>x.n===r.from_name),open=t&&S.view==="chat"&&S.thread===t.id&&!document.hidden;if(r.status==="sent")RT.mark(r.id,open?"read":"delivered");else if(open&&r.status!=="read")RT.mark(r.id,"read")},

 async poll(){if(S.out||!S.me||RT.me!==S.name)return;if(SB_ON&&RT.ok===false&&Date.now()-RT.at<30000)return;

   if(RT.first){const o=await RT.rows({from:S.name});let ch=false;o.forEach(x=>{if(S.threads.some(t=>t.m.some(m=>m.id===x.id)))return;stubUser(x.to_name);const t=ensure(x.to_name);let i=t.m.length;while(i>0&&t.m[i-1].ts>+x.ts)i--;t.m.splice(i,0,{id:x.id,me:1,t:x.body,ts:+x.ts,st:x.status||"sent"});ch=true});if(ch){save();ui()}RT.first=false}
   const pend=S.threads.flatMap(t=>t.m).filter(m=>m.me&&(m.st==="sent"||m.st==="delivered"));

  catch(e){if(RT.ok===false)ui()}},
 async start(){if(S.out||!S.me||RT.me===S.name)return;RT.stop();RT.me=S.name;RT.since=0;RT.first=true;RT.poll();RT.timer=setInterval(RT.poll,SB_ON?5000:3000);

 m.hidden=false;if(i)i.setAttribute("aria-expanded","true");
 if(force!==true){const s=m.querySelector("[aria-selected=true]");if(s)m.scrollTop=Math.max(0,s.offsetTop-m.clientHeight/2+s.offsetHeight/2)}}
function toggleLocMenu(e){if(e)e.stopPropagation();const m=document.getElementById("locmenu");if(!m)return;if(m.hidden)openLocMenu(true);else closeLocMenu()}
function pickLoc(v){S.qloc=String(v||"").slice(0,40);const i=document.getElementById("qloc");if(i)i.value=S.qloc;closeLocMenu();const c=document.getElementById("qlclr");if(c)c.classList.toggle("hide",!S.qloc);save();doSearch()}
function closeSug(){const s=document.getElementById("nsug");if(s)s.hidden=true}
function nameSug(){const s=document.getElementById("nsug");if(!s)return;const q=(S.q||"").trim().toLowerCase();if(!q){s.hidden=true;return}closeLocMenu();
 const m=searchModel(),sc=(t,base)=>{t=String(t||"").toLowerCase();return base+(t.startsWith(q)?0:t.split(/\s+/).some(w=>w.startsWith(q))?1:2)};
 const C=[];
 if(m){m.pe.forEach(u=>C.push({s:sc(u.name,0),k:"p",n:u.name,t:u.name,sub:roleOf(u.name)}));
  m.ss.forEach(x=>C.push({s:sc(x.t,3),k:"s",id:x.id,c:x.c,t:x.t,sub:"Talent · "+x.c+" · "+x.by}));
  m.ps.forEach(j=>C.push({s:sc(j.t,6),k:"j",id:j.id,c:j.c,t:j.t,sub:"Work · "+j.c+" · "+j.by}))}
 allPlaces().filter(l=>l.toLowerCase().includes(q)).slice(0,2).forEach(l=>C.push({s:sc(l,2),k:"l",n:l,t:l,sub:"Location"}));
 const L=C.sort((a,b)=>a.s-b.s).slice(0,4);
 s.innerHTML=L.length?L.map(r=>`<button type="button" role="option" data-k="${r.k}" data-n="${esc(r.n||"")}" data-id="${r.id||""}" onclick="sugPick(this.dataset.k,this.dataset.n,this.dataset.id)">${r.k==="l"?`<span class="sugi" aria-hidden="true">${LOC}</span>`:r.k==="p"?`<span class="av sm" style="${abg(r.n)}" aria-hidden="true">${ait(r.n)}</span>`:`<span class="sugi" style="${cTile(r.c)}" aria-hidden="true">${cIcon(r.c)}</span>`}<span><b>${esc(r.t)}</b><small>${esc(r.sub)}</small></span></button>`).join("")+`<button type="button" class="nsall" onclick="doSearch()">See all results</button>`:`<div class="nsn">No results found</div>`;s.hidden=false}
function sugPick(k,n,id){closeSug();if(k==="l"){S.q=n;const i=document.getElementById("q");if(i)i.value=n;save();doSearch();return}if(k==="p")openProfile(n);else if(k==="s")openService(+id);else openPost(+id)}
function doSearch(){closeLocMenu();closeSug();const a=document.activeElement;if(a&&a!==document.body&&a.blur)a.blur();
 if(!searchModel()){sOpen=false;updateSearchUI();toast("Type a name, designation or location to search");return}
 sOpen=true;sMore=false;updateSearchUI();const sb=document.getElementById("sbar");if(sb)sb.scrollIntoView({block:"start",behavior:"auto"})}
document.addEventListener("pointerdown",e=>{const t=e.target.closest?e.target:null;if(!t)return;const m=document.getElementById("locmenu");if(m&&!m.hidden&&!t.closest("#locsf"))closeLocMenu();const s=document.getElementById("nsug");if(s&&!s.hidden&&!t.closest("#namesf"))closeSug()},true);

function openPosts(){if(S.out)return;
 const L=[...S.jobs.filter(j=>j.by===S.name).map(o=>({o,k:"job"})),...S.services.filter(j=>j.by===S.name).map(o=>({o,k:"service"}))].sort((a,b)=>b.o.id-a.o.id),nv=L.filter(x=>x.k==="job").length,ns=L.length-nv,n=L.length;
 const row=({o,k})=>{const isS=k==="service",cnt=isS?(o.b||[]).length:(o.p||[]).length;return `<button type="button" class="mprow" onclick="postsOpen('${k}',${o.id})" aria-label="Open ${esc(o.t)}"><span><b>${esc(o.t)}</b><small>${esc(o.c)} · ${isS?esc(rateTx(o))+" per "+uOf(o):esc(o.b)+" "+per(o).replace(/<[^>]+>/g,"")} · ${cnt} ${isS?"booking":"request"}${cnt===1?"":"s"}</small></span><span class="pill ${isS?"Completed":"Requested"}">${isS?"Service":"Vacancy"}</span><span class="chev" aria-hidden="true">›</span></button>`};
 postsD.innerHTML=`<div class="dh"><h3 style="margin:0">Your posts</h3><button class="x" aria-label="Close" onclick="postsD.close()">✕</button></div><div class="pbig"><b>${n}</b><span>${n===1?"post":"posts"}${n?` · ${nv} vacanc${nv===1?"y":"ies"} · ${ns} service${ns===1?"":"s"}`:""}</span></div><button class="btn" onclick="postsD.close();go('add')">Create a post</button>
 ${n?`<h4 class="mphd">Active posts (${n})</h4><div class="mplist">${L.map(row).join("")}</div><p class="mphint">Tap a post to open it. Use Edit on the post page to change it.</p>`:`<p class="mphint" style="text-align:center">You haven’t posted anything yet.</p>`}`;
 if(!postsD.open)postsD.showModal()}
function postsOpen(k,id){postsD.close();k==="service"?openService(id):openPost(id)}
const followingOf=n=>folOf(n).filter(k=>k!==n&&S.users.some(u=>u.name===k)).sort((a,b)=>a.localeCompare(b));
function openFolList(kind){if(S.out)return;const fo=kind==="following",L=fo?followingOf(S.name):followersOf(S.name),T=fo?"Following":"Followers";folD.setAttribute("aria-label",T);
 folD.innerHTML=`<div class="dh"><h3 style="margin:0">${T} (${L.length})</h3><button class="x" aria-label="Close" onclick="folD.close()">✕</button></div>${L.length?`<div class="flist">${L.map(n=>`<div class="frow"><button type="button" class="fmain" data-n="${esc(n)}" onclick="folProfile(this.dataset.n)" aria-label="View profile of ${esc(n)}"><span class="av sm" style="${abg(n)}" aria-hidden="true">${ait(n)}</span><span><b>${esc(n)}</b><small>${esc(roleOf(n))}</small></span></button>${fo?`<button type="button" class="btn alt" data-n="${esc(n)}" onclick="folUnf(this.dataset.n)" aria-label="Unfollow ${esc(n)}">Unfollow</button>`:`<button type="button" class="btn alt" data-n="${esc(n)}" onclick="folMsg(this.dataset.n)" aria-label="Message ${esc(n)}">Message</button>`}</div>`).join("")}</div>`:`<div class="empty" style="padding:18px">${fo?"You aren’t following anyone yet. Open a profile and tap Follow.":"No followers yet. When people follow you, they will show up here."}</div>`}`;
 if(!folD.open)folD.showModal()}
const openFollowers=()=>openFolList("followers"),openFollowing=()=>openFolList("following");
function folUnf(n){toggleFollow(n);openFolList("following");if(S.view==="profile")render()}
function folProfile(n){folD.close();openProfile(n)}
function folMsg(n){folD.close();msgTo(n)}

{const cb=document.getElementById("chatB"),bb=document.getElementById("bellB");if(cb)cb.querySelector("svg").outerHTML=FI.chat.replace("<svg ",'<svg width="27" height="27" ');if(bb)bb.querySelector("svg").outerHTML=FI.bell.replace("<svg ",'<svg width="28" height="28" ')}

setTimeout(hideSplash,reduce?700:2700);
