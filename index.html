/* splash */
#splash{position:fixed;inset:0;z-index:200;background:linear-gradient(160deg,var(--plum),var(--plum2));display:grid;place-items:center;color:#fff;transition:opacity .5s ease,transform .5s ease;cursor:pointer}
#splash.leave{opacity:0;transform:scale(1.05);pointer-events:none}
.sp-in{position:relative;display:grid;justify-items:center;gap:22px;padding:24px}
.sp-ring{position:absolute;top:50%;left:50%;width:200px;height:200px;margin:-130px 0 0 -100px;border-radius:50%;border:3px solid rgba(255,255,255,.55);opacity:0;animation:ring 1.8s .6s ease-out infinite}
.sp-logo{background:#fff;border-radius:30px;padding:18px 26px;box-shadow:0 18px 50px rgba(0,0,0,.3);animation:pop .95s cubic-bezier(.2,1.4,.4,1) both}
.sp-logo img{height:clamp(96px,28vw,140px);width:auto;display:block}
.sp-tag{margin:0;font-weight:700;font-size:clamp(15px,4vw,19px);letter-spacing:.2px;animation:fadeup .7s .9s ease both}
.sp-bar{width:140px;height:4px;border-radius:4px;background:rgba(255,255,255,.28);overflow:hidden}.sp-bar i{display:block;height:100%;background:#fff;border-radius:4px;animation:fill 2.2s .2s ease-out both}
@keyframes pop{0%{opacity:0;transform:scale(.35) rotate(-10deg)}60%{opacity:1;transform:scale(1.08) rotate(2deg)}100%{opacity:1;transform:none}}
@keyframes ring{0%{transform:scale(.6);opacity:.8}100%{transform:scale(1.8);opacity:0}}
@keyframes fadeup{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes fill{from{width:0}to{width:100%}}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){#splash,#splash *{animation:none!important;transition:none!important}}

 <form class="send" style="max-width:none" onsubmit="sendMsg(event)"><input id="mi" autocomplete="off" aria-label="Message" placeholder="Write a message"><button class="btn">Send</button></form>`:`<div class="empty" style="margin:auto">Pick a conversation to start chatting.</div>`}</section></div>`;

function sendMsg(e){e.preventDefault();const i=document.getElementById("mi");if(Chat.send(S.thread,i.value)){i.value=""}ui()}
const R=["Sounds good. When can we talk details?","Thanks! Can you share your availability?","Great, I’ll confirm shortly.","Perfect. Please send photos if you have them."];
function reply(){}
const rank={sending:0,sent:1,delivered:2,read:3};
const Net={on:navigator.onLine!==false,lat:[250,600],fail:0,drop:0,pace:1,seen:new Set(),outbox:[],
 send(e){return new Promise((ok,no)=>{if(!Net.on)return no("offline");if(Math.random()<Net.fail)return no("error");
  const dup=Net.seen.has(e.id);Net.seen.add(e.id);
  setTimeout(()=>{if(!Net.on)return no("offline");if(Math.random()<Net.drop)return;ok({id:e.id,dup});if(!dup)Net.peer(e)},Net.lat[0]+Math.random()*(Net.lat[1]-Net.lat[0]))})},
 peer(e){const k=Net.pace,u=S.users.find(x=>x.name===e.peer);
  setTimeout(()=>Chat.receipt(e.id,"delivered"),400*k);setTimeout(()=>Chat.receipt(e.id,"read"),1200*k);
  if(u&&u.status!=="active")return;
  setTimeout(()=>Chat.typing(e.peer,1),1500*k);setTimeout(()=>Net.deliver({id:"s"+uid(),peer:e.peer,t:R[Math.random()*R.length|0],ts:Date.now()}),2600*k)},
 deliver(m){if(!Net.on){Net.outbox.push(m);return}Chat.receive(m)},
 set(on){if(Net.on===on)return;Net.on=on;if(on){const o=Net.outbox.splice(0);o.forEach(Chat.receive);S.threads.forEach(t=>t.m.forEach(m=>{if(m.st==="sending")m.next=0}));Chat.flush()}ui()}};
const Chat={busy:0,ackMs:4000,max:5,base:800,rt:null,
 send(tid,text){const t=S.threads.find(x=>x.id===tid);text=(text||"").trim();if(!t||!text)return null;if(text.length>1000){toast("Message is too long (max 1000 characters)");return null}
  const m={id:"m"+uid(),me:1,t:text,ts:Date.now(),st:"sending",tries:0};t.m.push(m);S.chatStats.sent++;save();Chat.flush();return m},
 async flush(){if(Chat.busy||!Net.on)return;Chat.busy=1;
  try{for(const t of S.threads)for(const m of t.m){if(!m.me||m.st!=="sending")continue;if(m.next>Date.now())break;
   try{await Promise.race([Net.send({id:m.id,peer:t.n,t:m.t,ts:m.ts}),new Promise((_,no)=>setTimeout(()=>no("timeout"),Chat.ackMs))]);if(rank[m.st]<1)m.st="sent"}
   catch(e){m.tries++;S.chatStats.retries++;if(m.tries>=Chat.max){m.st="failed";S.chatStats.failed++;Notify.add({type:"chat",key:"chat:fail:"+t.n,title:`Message to ${t.n} failed`,body:"Open the chat to retry sending.",act:{k:"chat",n:t.n}})}else m.next=Date.now()+Math.min(15000,Chat.base*2**m.tries)*(.8+Math.random()*.4)}
   save();ui()}}finally{Chat.busy=0}
  const w=S.threads.flatMap(t=>t.m).filter(m=>m.me&&m.st==="sending");clearTimeout(Chat.rt);
  if(w.length&&Net.on)Chat.rt=setTimeout(Chat.flush,Math.max(50,Math.min(...w.map(m=>(m.next||0)-Date.now()))))},
 retry(id){S.threads.forEach(t=>t.m.forEach(m=>{if(m.id===id){m.st="sending";m.tries=0;m.next=0}}));Chat.flush();ui()},
 receipt(id,st){S.threads.forEach(t=>t.m.forEach(m=>{if(m.id===id&&rank[st]>rank[m.st]){m.st=st;if(m.me&&(st==="delivered"||st==="read"))Notify.add({type:"chat",key:"chat:st:"+t.n,title:st==="read"?`${t.n} read your message`:`Message delivered to ${t.n}`,body:m.t.slice(0,90),act:{k:"chat",n:t.n},read:S.view==="chat"&&S.thread===t.id?1:0})}}));save();ui()},
 typing(n,on){const t=S.threads.find(x=>x.n===n);if(!t)return;t.typing=on;clearTimeout(t.tt);if(on)t.tt=setTimeout(()=>{t.typing=0;ui()},3000);ui()},
 receive(m){if(S.threads.some(t=>t.m.some(x=>x.id===m.id)))return;const t=ensure(m.peer);t.typing=0;
  let i=t.m.length;while(i>0&&t.m[i-1].ts>m.ts)i--;t.m.splice(i,0,{id:m.id,t:m.t,ts:m.ts});
  if(!(S.view==="chat"&&S.thread===t.id)){t.u=1;if(!m.quiet)Notify.add({type:"chat",key:"chat:msg:"+t.n,title:`New message from ${t.n}`,body:m.t.slice(0,90),act:{k:"chat",n:t.n}})}save();ui()}};
function ui(){const i=document.getElementById("mi"),v=i?i.value:"",f=i&&document.activeElement===i;render();const n=document.getElementById("mi");if(n){n.value=v;if(f)n.focus()}}
addEventListener("online",()=>Net.set(true));addEventListener("offline",()=>Net.set(false));
setTimeout(()=>Chat.flush(),0)

function settings(){
 const P=S.priv,th=S.theme||"auto",pr=S.profile,nm=pr.name||S.name,cl=S.role==="client";
 const row=(ic,t,sub,a,c2="")=>`<button class="srow ${c2}" onclick="${a}"><span class="si" aria-hidden="true">${ic}</span><span><b>${t}</b><small>${sub}</small></span><span aria-hidden="true">›</span></button>`;
 const tg=(k,l,s)=>`<label class="tgl"><span>${l}<small>${s}</small></span><input type="checkbox" role="switch" ${P[k]?"checked":""} onchange="S.priv.${k}=this.checked;save()"></label>`;
 const rt=(v,e,t,s)=>`<button class="rtile" aria-pressed="${S.role===v}" onclick="S.role='${v}';render()"><span class="si" aria-hidden="true">${e}</span><span><b>${t}</b><small>${s}</small></span><span class="chk" aria-hidden="true">✓</span></button>`;
 view.innerHTML=`<div class="row"><h2>Settings</h2></div><div class="sx">
 <section class="sprof"><div class="av" style="${abg(nm)}" aria-hidden="true">${ait(nm)}</div><div class="sinfo"><h3>${esc(nm)}</h3><small>${esc(pr.email||"Add your details")}</small><span class="rolep">${cl?"Client":"Service provider"}</span></div><button class="btn" onclick="editP=true;go('profile')">Edit profile</button></section>
 <div class="sgrid"><div class="scol">
  <section class="scard"><h4>Account</h4>
   ${row("✏️","Edit profile","Name, age, email and phone","editP=true;go('profile')")}
   ${row("🔔","Notifications",unreadN()?unreadN()+" unread":"You’re all caught up","go('notifications')")}
   ${row("⭐","Subscription plan",(PLANS.find(q=>q.id===S.plan)||PLANS[0]).n+" plan · compare plans","openPlans()")}
   ${(()=>{const u=S.users.find(x=>x.email===S.me),g=u&&u.gid;return `<div class="srow gstat"><span class="si" aria-hidden="true">${GG}</span><span><b>Google account</b><small>${g?"Linked to "+esc(u.email):"Not linked. Sign in with Google using "+esc(S.profile.email||"your email")+" to link it"}</small></span><span class="pill ${g?"Completed":"Requested"}">${g?"Linked":"Not linked"}</span></div>`})()}
   ${row(IC.clock,"History","View booking history","go('history')")}
   ${row("🛟","Help & support","Contact us or report an issue","go('support')")}</section>
  <section class="scard"><h4>Appearance</h4><div class="themes" role="group" aria-label="Theme">${[["light","☀️","Light"],["dark","🌙","Dark"],["auto","🖥️","Auto"]].map(([k,e,l])=>`<button class="tile" aria-pressed="${th===k}" onclick="S.theme='${k}';applyTheme();render()"><span aria-hidden="true">${e}</span>${l}</button>`).join("")}</div></section>
  <section class="scard"><h4>I am a</h4><div class="roles" role="group" aria-label="Account type">${rt("client","🧑‍💼","Client","Post jobs and review pitches")}${rt("worker","🛠️","Service provider","Find work and pitch for jobs")}</div></section>
 </div><div class="scol">
  <section class="scard"><h4>Privacy</h4>${tg("vis","Show my profile","Let other users find and view it")}${tg("online","Show when I’m online","Display an online dot on your avatar")}${tg("msgs","Allow messages from anyone","Turn off to limit who can message you")}</section>
  <section class="scard"><h4>Help</h4><details><summary>How do I post a job?</summary><p>Open Add, fill in the title, field, budget, location and details, then tap Publish.</p></details><details><summary>How do I pitch for a job?</summary><p>Tap Pitch for Job on a post, enter your price and start date, and explain why you’re a good fit.</p></details><details><summary>How do I chat with a client?</summary><p>Tap Message on a post, or open a person’s profile from their name on any post.</p></details><button class="btn alt" onclick="toast('Support request sent. We’ll reply to your email.')">Contact support</button></section>
  ${row("🚪","Log out","Sign out of this device","outD.showModal()","slog danger")}
 </div></div></div>`}

function profile(){const p=S.profile,v=x=>x?esc(x):"Not added",mj=[...S.jobs,...S.services].filter(j=>j.by===S.name),
 views=mj.reduce((a,j)=>a+j.v.length,0)+S.stories.filter(x=>x.by===S.name).reduce((a,x)=>a+x.v.length,0),
 reqs=S.hist.filter(h=>h.s==="Requested").length;
 const item=(ic,l,val)=>`<div class="pi"><span class="si" aria-hidden="true">${ic}</span><div><small>${l}</small><b>${val}</b></div></div>`;
 const mrow=(ic,t,sub,a,cl="")=>`<button class="srow ${cl}" onclick="${a}"><span class="si" aria-hidden="true">${ic}</span><span><b>${t}</b><small>${sub}</small></span><span aria-hidden="true">›</span></button>`;
 view.innerHTML=`<div class="row"><h2>My profile</h2></div><div class="prof">
 <div class="pleft"><div class="pban"><div class="avedit"><div class="av" style="${abg(p.name)}">${ait(p.name)}</div><button class="camb" aria-label="Change profile picture" onclick="pickPhoto()">📷</button></div><input id="phf" type="file" accept="image/png,image/jpeg,image/webp,image/gif" hidden onchange="onPhoto(this)"><h3>${esc(p.name)}</h3><span class="rolep">${S.role==="client"?"Client":"Service provider"}</span>${p.email?`<span class="mail">${esc(p.email)}</span>`:""}<div class="phbtns"><button class="btn alt" onclick="pickPhoto()">${photoOf(p.name)?"Change photo":"Upload photo"}</button>${photoOf(p.name)?`<button class="link" onclick="removePhoto()">Remove</button>`:""}</div></div>
 <div class="pst" aria-label="Your activity"><div><b>${mj.length}</b><span>Posts</span></div><div><b>${reqs}</b><span>Requests</span></div><div><b>${views}</b><span>Views</span></div></div></div>
 <div class="pright">${editP?`<form class="pform pcard" style="padding:16px" onsubmit="saveProfile(event)">
 <div class="two"><label>Full name<input id="pn" required maxlength="40" value="${esc(p.name)}" autocomplete="name"></label>
 <label>Age<input id="pa" type="number" min="16" max="99" required value="${esc(p.age)}"></label></div>
 <div class="two"><label>Email ID<input id="pe" type="email" required value="${esc(p.email)}" autocomplete="email"></label>
 <label>Phone number<input id="pph" type="tel" required pattern="[0-9+\\s\\-]{7,16}" title="Use digits, spaces, + or -" value="${esc(p.phone)}" autocomplete="tel"></label></div>
 <label>Company name or service role (optional)<input id="pt" maxlength="40" value="${esc(p.title||"")}" placeholder="e.g. Plumber or Sharma Constructions"></label>
 <div class="acts"><button class="btn">Save changes</button><button type="button" class="btn alt" onclick="editP=false;render()">Cancel</button></div></form>`
 :`<div class="pcard"><h4>Personal details</h4>${item(IC.person,"Name",v(p.name))}${item(IC.person,"Company / role",esc(roleOf(S.name)))}${item(IC.person,"Age",v(p.age))}${item(IC.mail,"Email ID",v(p.email))}${item(IC.phone,"Phone number",v(p.phone))}</div>
 ${myPosts(mj)}<div class="pmenu">${mrow(IC.edit,"Edit profile","Update your name, email and phone","editP=true;render()")}${mrow(IC.clock,"History","View booking history","go('history')")}${mrow(IC.settings,"Settings","Theme, privacy and help","go('settings')")}${mrow(IC.out,"Log out","Sign out of this device","outD.showModal()","danger")}</div>`}</div></div>`}
function pickPhoto(){const f=document.getElementById("phf");if(f)f.click()}
function onPhoto(inp){const f=inp.files&&inp.files[0];inp.value="";if(!f)return;
 if(!/^image\/(png|jpe?g|webp|gif)$/.test(f.type)){toast("Choose a PNG, JPG, WebP or GIF image");return}
 if(f.size>10*1024*1024){toast("That image is too large (max 10 MB)");return}
 const img=new Image(),url=URL.createObjectURL(f);
 img.onload=()=>{URL.revokeObjectURL(url);try{const N=256,c=document.createElement("canvas");c.width=c.height=N;const g=c.getContext("2d"),m=Math.min(img.width,img.height);g.fillStyle="#fff";g.fillRect(0,0,N,N);g.drawImage(img,(img.width-m)/2,(img.height-m)/2,m,m,0,0,N,N);
  const u=S.users.find(q=>q.email===S.me);if(!u){toast("Log in to change your picture");return}u.photo=c.toDataURL("image/jpeg",.85);save();toast("Profile picture updated");render();nav()}catch(e){toast("Couldn’t use that image")}};
 img.onerror=()=>{URL.revokeObjectURL(url);toast("Couldn’t read that image")};img.src=url}
function removePhoto(){const u=S.users.find(q=>q.email===S.me);if(u){delete u.photo;save();toast("Profile picture removed");render()}}
function myPosts(mj){const row=o=>{const isS=!!o.min,kind=isS?"service":"job";return `<div class="mp"><button class="mpt" onclick="${isS?"openService":"openPost"}(${o.id})"><b>${esc(o.t)}</b><small>${isS?"Service":"Vacancy"} · ${esc(o.c)} · ${isS?rateTx(o)+" per "+uOf(o):esc(o.b)+per(o)}</small></button><div class="mpa"><button class="btn alt" aria-label="Edit ${esc(o.t)}" onclick="editPost('${kind}',${o.id})">Edit</button><button class="btn alt dng" aria-label="Delete ${esc(o.t)}" onclick="delPost('${kind}',${o.id})">Delete</button></div></div>`};
 return `<div class="pcard" id="myposts"><h4>My posts (${mj.length})</h4>${mj.length?mj.map(row).join(""):`<p class="cnt" style="margin:0">You haven’t posted anything yet.</p><button class="btn" style="justify-self:start;margin-top:10px" onclick="go('add')">Create a post</button>`}</div>`}
function saveProfile(e){e.preventDefault();const o=S.profile.name,n=pn.value.trim();
 const ne=pe.value.trim().toLowerCase(),ur=S.users.find(x=>x.email===S.me);
 if(S.users.some(x=>x!==ur&&x.email.toLowerCase()===ne)){toast("That email is already registered");return}
 if(ur){ur.name=n;ur.age=pa.value;ur.phone=pph.value.trim();ur.email=ne;ur.title=pt.value.trim()}S.services.forEach(x=>{if(x.by===o)x.by=n;x.v=x.v.map(y=>y===o?n:y);x.b.forEach(b=>{if(b.by===o)b.by=n})});S.me=ne;
 S.jobs.forEach(j=>{if(j.by===o)j.by=n;j.v=j.v.map(x=>x===o?n:x);j.p.forEach(q=>{if(q.by===o)q.by=n})});S.stories.forEach(x=>{if(x.by===o)x.by=n;x.v=x.v.map(y=>y===o?n:y)});
 S.profile={name:n,age:pa.value,email:pe.value.trim(),phone:pph.value.trim(),title:pt.value.trim()};S.name=n;editP=false;toast("Profile saved");render()}
const reduce=!!(window.matchMedia&&matchMedia("(prefers-reduced-motion:reduce)").matches);
spl.src=LG.s;document.querySelector(".app").inert=true;
function hideSplash(){if(!window.splash)return;const sp=document.getElementById("splash");if(!sp)return;sp.classList.add("leave");document.querySelector(".app").inert=false;setTimeout(()=>sp.remove(),reduce?0:550)}
setTimeout(hideSplash,reduce?700:2700);
render();
resumeNeg();scheduleNewPro();
